version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      time: '03:15'
    open-pull-requests-limit: 5
    groups:
      npm-dependencies-group:
        patterns:
          - '*'
    labels:
      - 'dependencies'
      - 'npm'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      time: '03:15'
    open-pull-requests-limit: 5
    groups:
      github-actions-group:
        patterns:
          - '*'
    labels:
      - 'dependencies'
      - 'github-actions'
