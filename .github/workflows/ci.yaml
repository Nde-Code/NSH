name: CI

on:
  push:
    branches:
      - main

  schedule:
    - cron: '27 1 17 * *'

  workflow_dispatch:

jobs:
  format-check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Prettier format check
        run: npm run prettier-check

  type-check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Generate Wrangler types
        run: npm run types

      - name: TypeScript type check
        run: npm run check-types

  integrity-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create .dev.vars file
        run: |
          echo "FIREBASE_REALTIME_DATABASE_URL=\"${{ secrets.FIREBASE_REALTIME_DATABASE_URL }}\"" > .dev.vars
          echo "FIREBASE_HIDDEN_PATH=\"${{ secrets.FIREBASE_HIDDEN_PATH }}\"" >> .dev.vars
          echo "IP_HASH_SALT=\"${{ secrets.IP_HASH_SALT }}\"" >> .dev.vars
          echo "ADMIN_KEY=\"${{ secrets.ADMIN_KEY }}\"" >> .dev.vars
          echo "MONITORING_KEY=\"${{ secrets.MONITORING_KEY }}\"" >> .dev.vars

      - name: Start Wrangler Dev
        run: |
          npm run dev -- --show-interactive-dev-session=false --port 8787 &
          sleep 15

      - name: Run API integrity test suite
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          MONITORING_KEY: ${{ secrets.MONITORING_KEY }}
        run: |
          curl -sL "${{ vars.GIST_TEST_SCRIPT }}" -o nsh.py
          python nsh.py \
            --link "https://test.domain.com" \
            --remote "http://localhost:8787" \
            --max-url-length 2000 \
            --max-daily-write 10 \
            --timeout 25 \
            --delay 12 \
            --id-length 14
