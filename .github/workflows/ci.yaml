name: CI

on:
  # Run workflow when changes are pushed to the main branch:
  push:
    branches:
      - main

  # Run scheduled monthly integrity checks:
  schedule:
    - cron: "27 1 17 * *"

  # Allow manual workflow execution:
  workflow_dispatch:

jobs:
  type-check:
    # Use ubuntu-latest runner for a consistent Linux CI environment:
    runs-on: ubuntu-latest

    # Restrict repository access to read-only:
    permissions:
      contents: read

    steps:
      # 0. Checkout repository sources:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 1. Set up Node.js runtime required by project tooling:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # 2. Install Node.js dependencies:
      - name: Install Node.js dependencies
        run: npm ci

      # 3. Generate Wrangler types for the TypeScript project:
      - name: Generate Wrangler types
        run: npm run types

      # 4. Run TypeScript type checking:
      - name: TypeScript type check
        run: npm run check-types

  integrity-test:
    # Use ubuntu-latest runner for a consistent Linux CI environment:
    runs-on: ubuntu-latest

    # Restrict repository access to read-only:
    permissions:
      contents: read

    steps:
      # 0. Checkout repository sources:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 1. Set up Node.js runtime required by project tooling:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # 2. Install Node.js dependencies:
      - name: Install Node.js dependencies
        run: npm ci

      # 3. Set up Python environment for the integrity test script:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 4. Install Python dependencies:
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 5. Create local environment variables:
      - name: Create .dev.vars file
        run: |
          echo "FIREBASE_REALTIME_DATABASE_URL=\"${{ secrets.FIREBASE_REALTIME_DATABASE_URL }}\"" > .dev.vars
          echo "FIREBASE_HIDDEN_PATH=\"${{ secrets.FIREBASE_HIDDEN_PATH }}\"" >> .dev.vars
          echo "IP_HASH_SALT=\"${{ secrets.IP_HASH_SALT }}\"" >> .dev.vars
          echo "ADMIN_KEY=\"${{ secrets.ADMIN_KEY }}\"" >> .dev.vars
          echo "MONITORING_KEY=\"${{ secrets.MONITORING_KEY }}\"" >> .dev.vars

      # 6. Start Wrangler development server in the background:
      - name: Start Wrangler Dev (Background)
        run: |
          npm run dev -- --show-interactive-dev-session=false --port 8787 &
          sleep 15

      # 7. Execute the API integrity test suite against the local worker:
      - name: Run API integrity test suite
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          MONITORING_KEY: ${{ secrets.MONITORING_KEY }}
        run: |
          curl -sL "${{ vars.GIST_TEST_SCRIPT }}" -o nsh.py && \
          python nsh.py \
            --link "https://test.domain.com" \
            --remote "http://localhost:8787" \
            --max-url-length 2000 \
            --max-daily-write 10 \
            --timeout 25 \
            --delay 12 \
            --id-length 14